<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 행성 · Terra</title>
  <style>
    :root {
      --bg-0: #0a1118;
      --bg-1: #122031;
      --bg-2: #1d3346;
      --green-bright: #8ee6a6;
      --green: #5fc488;
      --green-deep: #36a368;
      --green-darker: #2a7a52;
      --accent-light: #c4f5d3;
      --card: rgba(20, 44, 32, 0.72);
      --card-border: rgba(95, 196, 136, 0.24);
      --text: #dcf2e4;
      --muted: #aecdb9;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { overflow-x: clip; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% -10%, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* ===================== 우주 배경 ===================== */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .nebula { position: absolute; border-radius: 50%; filter: blur(90px); }
    .nebula.a { width: 380px; height: 380px; background: radial-gradient(circle, var(--green-bright), transparent 70%); top: -100px; left: -100px; opacity: 0.22; }
    .nebula.b { width: 440px; height: 440px; background: radial-gradient(circle, var(--green-deep), transparent 70%); bottom: -140px; right: -120px; opacity: 0.22; }
    .nebula.c { width: 300px; height: 300px; background: radial-gradient(circle, #2f7a55, transparent 70%); top: 40%; left: 55%; opacity: 0.16; }
    .stars { position: absolute; inset: -50%; background-repeat: repeat; }
    .stars.l1 {
      background-image:
        radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 70% 60%, #cfeede, transparent),
        radial-gradient(2px 2px at 40% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 85% 20%, #aef0c4, transparent);
      background-size: 340px 340px; opacity: 0.6;
      animation: twinkle 5s ease-in-out infinite, drift 140s linear infinite;
    }
    .stars.l2 {
      background-image:
        radial-gradient(1px 1px at 10% 50%, #b8ffe0, transparent),
        radial-gradient(1px 1px at 60% 25%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 32% 70%, #c4f5d3, transparent),
        radial-gradient(1px 1px at 90% 80%, #fff, transparent);
      background-size: 240px 240px; opacity: 0.45;
      animation: twinkle 7s ease-in-out infinite 1s, drift 200s linear infinite reverse;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.65; } }
    @keyframes drift { to { transform: translate(60px, 40px); } }

    /* ===================== 상단 바 ===================== */
    .topbar {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 14px 18px 0;
    }
    .logout-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(8, 16, 12, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .logout-btn:hover { color: var(--green-bright); border-color: var(--green-bright); background: rgba(95, 196, 136, 0.1); }

    /* ===================== 본문 ===================== */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 24px 40px;
      text-align: center;
    }
    .greeting { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    .planet-title {
      font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 22px;
      text-shadow: 0 2px 18px rgba(95, 196, 136, 0.3);
    }

    /* 행성 비주얼 */
    .planet-stage {
      position: relative;
      width: 230px; height: 230px;
      margin: 6px 0 10px;
      display: grid;
      place-items: center;
    }
    .my-planet {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #aef0c4, #2a7a52 55%, #0e3322 100%);
      box-shadow: 0 0 80px rgba(54, 163, 104, 0.5), inset -22px -26px 60px rgba(0, 0, 0, 0.55);
      animation: floatA 14s ease-in-out infinite;
    }
    .planet-ring {
      position: absolute;
      width: 240px; height: 240px;
      border: 2px solid rgba(95, 196, 136, 0.28);
      border-radius: 50%;
      transform: rotate(-22deg);
      animation: spin 60s linear infinite;
    }
    .planet-ring::before {
      content: ""; position: absolute; top: -5px; left: 50%;
      width: 8px; height: 8px; margin-left: -4px;
      border-radius: 50%; background: var(--green-bright);
      box-shadow: 0 0 12px var(--green-bright);
    }
    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(0, -10px); }
    }
    @keyframes spin { to { transform: rotate(338deg); } }

    .planet-status {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--green-bright);
    }
    .planet-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

    /* ===================== 액션 버튼 ===================== */
    .actions {
      width: 100%;
      max-width: 360px;
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      text-decoration: none;
      cursor: pointer;
      text-align: left;
      transition: transform 0.1s ease, filter 0.15s ease, border-color 0.15s ease;
    }
    .action-btn:active { transform: scale(0.99); }
    .action-btn .ico { font-size: 26px; line-height: 1; }
    .action-btn .txt { display: flex; flex-direction: column; }
    .action-btn .txt b { font-size: 16px; font-weight: 800; }
    .action-btn .txt span { font-size: 12.5px; opacity: 0.85; margin-top: 2px; }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--green), var(--green-deep));
      color: #06210f;
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(54, 163, 104, 0.4);
    }
    .action-btn.primary:hover { filter: brightness(1.1); }
    .action-btn.secondary {
      background: var(--card);
      color: var(--text);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .action-btn.secondary .txt span { color: var(--muted); }
    .action-btn.secondary:hover { border-color: var(--green-bright); }

    @media (prefers-reduced-motion: reduce) {
      .stars, .my-planet, .planet-ring { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="stars l1"></div>
    <div class="stars l2"></div>
    <div class="nebula a"></div>
    <div class="nebula b"></div>
    <div class="nebula c"></div>
  </div>

  <!-- 상단: 로그아웃 (오른쪽 상단 작게) -->
  <header class="topbar">
    <a class="logout-btn" href="login.html" id="logoutBtn" aria-label="로그아웃">⎋ 로그아웃</a>
  </header>

  <main class="main">
    <p class="greeting">반가워요 🌱</p>
    <h1 class="planet-title">나의 행성</h1>

    <div class="planet-stage" aria-hidden="true">
      <div class="planet-ring"></div>
      <div class="my-planet"></div>
    </div>
    <p class="planet-status">행성이 푸르게 빛나고 있어요</p>
    <p class="planet-sub">탄소를 측정할수록 행성이 더 선명해져요</p>

    <nav class="actions">
      <a class="action-btn primary" href="index.html">
        <span class="ico" aria-hidden="true">🌿</span>
        <span class="txt"><b>탄소 측정</b><span>오늘의 탄소 발자국을 기록해요</span></span>
      </a>
      <a class="action-btn secondary" href="terra_coaching.html">
        <span class="ico" aria-hidden="true">🤖</span>
        <span class="txt"><b>AI 코치</b><span>맞춤형 탄소 줄이기 코칭 받기</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
